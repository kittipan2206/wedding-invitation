name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Vitest Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - run: npm install

      - name: Run unit tests
        run: npm test

      - name: Generate coverage report (informational only)
        run: npm run test:coverage || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - run: npm install

      # ── Cache Playwright browsers ────────────────────────────────────────────
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers (full, cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps only (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # ── PR + push to main: chromium + mobile against local dev server ────────
      # Vercel GitHub integration handles production deployment separately.
      # Running E2E against a CI-created Vercel preview fails because preview
      # deployments require Vercel authentication (Playwright gets login page).
      # Local dev server is always correct, fast, and avoids auth issues.
      - name: Run E2E against local dev server
        run: npm run test:e2e -- --project=chromium --project=mobile --workers=4
        # webServer in playwright.config.js starts `npm run dev` automatically

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
