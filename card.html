<!doctype html>
<html lang="th" class="card-page">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ส่งการ์ดเชิญ — นนท์ &amp; เมย์</title>
    <!-- the couple's tool, not a page for guests or search engines -->
    <meta name="robots" content="noindex" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=Trirong:wght@300;400&family=IBM+Plex+Sans+Thai+Looped:wght@400;500&family=Charm&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles/base.css" />
    <link rel="stylesheet" href="/src/styles/components/shared.css" />
    <link rel="stylesheet" href="/src/styles/components/card.css" />
    <script type="module" src="/src/js/send-invites.js"></script>
  </head>
  <body class="card-page">
    <main class="invite-tool">
      <header class="invite-head">
        <p class="invite-couple" id="invite-couple">นนท์ &amp; เมย์</p>
        <h1 class="invite-title">ส่งการ์ดเชิญ</h1>
        <p class="invite-sub">
          พิมพ์ชื่อแขก แล้วส่งซองที่จ่าหน้าถึงเขาทาง LINE — เว้นว่างไว้เพื่อส่งลงกลุ่ม
        </p>
      </header>

      <section class="invite-paper">
        <label class="invite-label" for="guest-name">ชื่อแขก</label>
        <input
          id="guest-name"
          class="form-input"
          type="text"
          autocomplete="off"
          maxlength="60"
          placeholder="เช่น ต้น หรือ คุณสมชาย และครอบครัว"
        />

        <p class="invite-label invite-label--gap">ตัวอย่างใน LINE</p>
        <div class="line-preview">
          <img
            id="line-preview-img"
            class="line-preview-img"
            src="/og-envelope.png"
            width="1200"
            height="630"
            alt="ซองจดหมายที่จะแสดงในแชท"
          />
          <div class="line-preview-text">
            <p class="line-preview-title" id="line-preview-title"></p>
            <p class="line-preview-domain" id="line-preview-domain"></p>
          </div>
        </div>

        <p class="invite-link" id="invite-link"></p>
        <div class="invite-actions">
          <a
            id="send-line-btn"
            class="btn-invite btn-invite--primary"
            target="_blank"
            rel="noopener"
            >ส่งทาง LINE</a
          >
          <button id="copy-link-btn" class="btn-invite" type="button">
            คัดลอกลิงก์
          </button>
        </div>
      </section>

      <section class="invite-paper invite-paper--card">
        <p class="invite-label">การ์ดรูปภาพ</p>
        <p class="invite-hint">
          สำหรับพิมพ์ หรือส่งให้ผู้ใหญ่ที่สะดวกดูเป็นรูป — มี QR เปิดการ์ดของแขกคนนั้น
        </p>
        <img
          id="card-thumb"
          class="card-thumb"
          width="1080"
          height="1350"
          alt="ตัวอย่างการ์ดรูปภาพ"
        />
        <button id="download-card-btn" class="btn-invite" type="button">
          ดาวน์โหลดการ์ดรูปภาพ
        </button>
      </section>
    </main>
  </body>
</html>
